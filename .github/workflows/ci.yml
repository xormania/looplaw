name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: gate the fixture (first producer, embedded law)
        run: go run ./cmd/looplaw validate internal/gate/testdata/library/set.cue
      - name: vet the law (second producer, cue binary)
        run: go run cuelang.org/go/cmd/cue@v0.17.1 vet ./law/
