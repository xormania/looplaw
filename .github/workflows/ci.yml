name: ci

on:
  push:
    branches: [master]
  pull_request:

# A superseded run proves nothing about the current head: cancel it
# rather than pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast lane: everything cheap, ordered cheapest-first, so a typo
  # or a law error is refused in seconds instead of after the slow lane.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The lane check reads commit history to find cross-lane
          # commits; the default shallow clone has none to read.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # First, and the reason it matters here rather than only locally:
      # this job hashes a working tree checked out from the commit, so it
      # compares committed content. A change pushed through git plumbing
      # never touches a file on disk and is invisible to a local run.
      - name: design basis lock
        run: dev/lock
      - name: lanes
        run: dev/lanes
      # A path into a home directory is unfollowable on every machine but
      # the one it was written on, and permanent once pushed. The
      # bracketed letters keep this file from matching its own pattern.
      - name: no machine paths in tracked files
        run: |
          leaked=$(git grep -nI -E '(/[h]ome/|/[U]sers/|/[r]oot/|~/[p]rojects/)' || true)
          test -z "$leaked" || { echo "$leaked"; echo 'tracked text names a machine filesystem'; exit 1; }
      # The derive-absorb path on this repository, not a fixture. In the
      # fast lane because dev/check mirrors that lane, and a check nothing
      # local runs is a check that fails first in CI.
      - name: derive and absorb this repository
        run: dev/absorb-self
      - name: format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt -w .'; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: vet the law (second producer, cue pinned to the embedded version)
        run: go run cuelang.org/go/cmd/cue vet ./schema/
      - name: test
        run: go test ./...
      - name: goldens are current (wire formats change only deliberately)
        run: |
          go test ./... -run Golden -count=1
          git diff --exit-code -- '*/testdata/golden/*'

  # The slow lane, running in parallel with the fast one.
  thorough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test with the race detector
        run: go test -race ./...
      - name: gate the fixture (first producer, embedded law)
        run: go run ./cmd/looplaw validate internal/gate/testdata/library/set.cue
      - name: the product stands without the workshop
        run: |
          tmp=$(mktemp -d)
          git archive HEAD | tar -x -C "$tmp"
          rm -rf "$tmp/dev" "$tmp/.claude" "$tmp/internal/conformance"
          cd "$tmp"
          go build -buildvcs=false -o ./looplaw-check ./cmd/looplaw
          ./looplaw-check validate internal/gate/testdata/library/set.cue
      # In the slow lane because it fetches the vulnerability database,
      # and the fast lane exists to fail in seconds. It asks the question
      # gofmt and vet cannot: is a known defect reachable from here. The
      # one it was added for was reachable on provenance.Compare, the
      # path that reads submitted manifests.
      - name: known defects reachable from this code
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: fixture differential (second producer, same data)
        run: |
          go run cuelang.org/go/cmd/cue export internal/gate/testdata/library/set.cue -o /tmp/set.json
          go run cuelang.org/go/cmd/cue vet ./schema/ /tmp/set.json -d '#TrinitySet'

