# Serena project configuration — tracked, so every machine and every
# harness gets the same setup rather than each one rediscovering it.
# Everything else under .serena/ is local state and gitignored.
project_name: "looplaw"
language_servers: ["go"]
encoding: "utf-8"
ignore_all_files_in_gitignore: true

# Recorded outputs are byte-copies of files that already exist, so
# indexing them makes every search report each fact twice — once from
# the source and once from its recording. They are written by tests and
# never edited by hand.
ignored_paths:
  - "**/testdata/golden/**"

# Richer diagnostics than `go vet` alone: staticcheck plus the analyses
# that catch real defects rather than style. Deliberately no gofumpt —
# CI enforces gofmt, and a language server flagging what CI does not
# would put the two out of step.
ls_specific_settings:
  go:
    gopls_settings:
      staticcheck: true
      analyses:
        unusedparams: true
        unusedwrite: true
        nilness: true
        useany: true

# The language server can wedge; without this the only recovery is
# killing the whole server and losing the session's connection.
included_optional_tools:
  - "restart_language_server"

# Given once on activation, so a session starts pointed at the right
# artifacts instead of rediscovering them by reading the corpus.
initial_prompt: |
  Read AGENTS.md first — it is the brief for this repository, and it is
  harness-neutral.

  Two habits that save the most here:
  - For anything about vocabulary, authority, or what the law says, read
    dev/DIGEST.md (18KB, generated from the law the binary carries), not
    dev/*.cue. Open the full text only when exact wording matters.
  - Run dev/check before pushing; it is CI's fast lane in the same order.
    dev/law regenerates the digest and reports ratification debt.

  Before inventing an adversarial input, look in
  internal/gate/testdata/attacks/ — every attack that has ever found a
  defect is kept there with the refusal it must draw.
